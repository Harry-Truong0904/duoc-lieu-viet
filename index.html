<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main>
    <header class="site-header">
      <h1 data-i18n="siteName"></h1>
      <button id="language-toggle" class="language-toggle" type="button" aria-pressed="false">
        <span id="language-vi" class="language-option" data-i18n="languageViShort"></span>
        <span class="language-separator" data-i18n="languageSeparator"></span>
        <span id="language-en" class="language-option" data-i18n="languageEnShort"></span>
      </button>
    </header>
    <p id="lede" class="lede" data-i18n="lede"></p>
    <div id="search-control">
      <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchLabel">
    </div>
    <section id="list">
      <div class="list-controls">
        <div class="logic-control">
          <span id="filter-logic-label" class="control-label" data-i18n="filterLogicLabel"></span>
          <div class="logic-options" role="group" aria-labelledby="filter-logic-label">
            <button id="logic-all" class="logic-option" type="button" aria-pressed="true" data-i18n="matchAll"></button>
            <button id="logic-any" class="logic-option" type="button" aria-pressed="false" data-i18n="matchAny"></button>
          </div>
        </div>
        <label class="sort-control" for="sort-select">
          <span class="control-label" data-i18n="sortLabel"></span>
          <select id="sort-select">
            <option value="default" data-i18n="sortOriginalOrder"></option>
            <option value="name-az" data-i18n="sortNameAZ"></option>
          </select>
        </label>
      </div>
      <div class="chips" id="chips" role="group" data-i18n-aria-label="effectsGroupLabel"></div>
      <p class="count" id="count" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
    </section>
    <section id="load-error" class="load-error" role="alert" hidden>
      <h1 data-i18n="loadErrorTitle"></h1>
      <p data-i18n="loadErrorMessage"></p>
    </section>
    <article id="detail" class="detail" hidden></article>
    <footer data-i18n="footerDisclaimer"></footer>
  </main>
</body>
</html>
